name: Android - referencia y comprobaciones

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preparar Gradle y validar wrapper
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Preparar Android SDK 36
        shell: bash
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Verificar herramientas y referencia fija
        run: |
          python -m unittest discover -s tools/tests -p "test_*.py"
          python tools/verificar_paridad.py

      # El runner no recibe credenciales MQTT, Firebase ni firma de producción.
      # Los casos pendientes no se presentan como paridad ya conseguida.
      - name: Ejecutar pruebas, compilar y analizar
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --continue --stacktrace

      - name: Comprobar resultados y recursos instalables
        run: |
          python tools/verificar_paridad.py --require-results
          python tools/verificar_apk.py

      - name: Conservar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar APK de desarrollo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rutautp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

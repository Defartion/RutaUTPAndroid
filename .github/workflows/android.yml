name: Android - referencia y comprobaciones

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preparar Gradle y validar wrapper
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Preparar Android SDK 36
        shell: bash
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Verificar herramientas y referencia fija
        run: |
          python -m unittest discover -s tools/tests -p "test_*.py"
          python tools/verificar_idiomas.py
          python tools/verificar_paridad.py
          python tools/verificar_capturas.py
          python tools/verificar_backend_push.py

      # El runner no recibe credenciales MQTT, Firebase ni firma de producción.
      # Los casos pendientes no se presentan como paridad ya conseguida.
      - name: Ejecutar pruebas, compilar y analizar
        run: >-
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --continue --stacktrace
          -PMAPS_API_KEY=RUTAUTP_CI_MAPS_SENTINEL
          -PMQTT_USERNAME=RUTAUTP_CI_USER_SENTINEL
          -PMQTT_PASSWORD=RUTAUTP_CI_PASSWORD_SENTINEL

      - name: Comprobar resultados y recursos instalables
        run: |
          python tools/verificar_paridad.py --require-results
          python tools/verificar_apk.py
          python tools/verificar_configuracion.py --expected-map-key RUTAUTP_CI_MAPS_SENTINEL --forbid RUTAUTP_CI_USER_SENTINEL --forbid RUTAUTP_CI_PASSWORD_SENTINEL

      - name: Conservar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar APK de desarrollo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rutautp-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Conservar APK de pruebas instrumentales
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rutautp-debug-androidTest
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  backend-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener integración Android
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtener únicamente la referencia fijada de main iOS
        uses: actions/checkout@v4
        with:
          repository: JDiazD33/RutaUTP
          ref: 8145276bb6fc72a168cc78119def2727578ec0bb
          path: app/build/backend-ios-reference
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar backend aislado
        run: python tools/preparar_backend_push.py --ios app/build/backend-ios-reference
      - name: Instalar dependencias de pruebas
        run: >-
          python -m pip install
          -r app/build/backend-phase7/backend/requirements-dev.txt
          -r app/build/backend-phase7/backend/requirements-fcm.txt
      # Todos los transportes se sustituyen por dobles; no hay credenciales ni broker.
      - name: Verificar APNs, FCM y quorum sin envíos
        run: >-
          python -m pytest -q
          app/build/backend-phase7/backend/tests/test_push_register_numbers.py
          app/build/backend-phase7/backend/tests/test_push_retry_registration.py
          app/build/backend-phase7/backend/tests/test_route_changes.py
          app/build/backend-phase7/backend/tests/test_fcm_integration.py
          --junitxml=app/build/reports/parity/backend-push-tests.xml
      - name: Comprobar resultados de integración
        run: python tools/verificar_backend_push.py --require-results
      - name: Conservar resultados del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-push-checks
          path: |
            app/build/reports/parity/backend-push-tests.xml
            app/build/reports/parity/backend-push-check.json
          if-no-files-found: warn
          retention-days: 14

  candidate:
    needs: [verify, backend-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código de la candidata
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar lector del APK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Obtener comprobaciones Android
        uses: actions/download-artifact@v4
        with:
          name: android-checks
          path: app/build
      - name: Obtener comprobaciones del backend
        uses: actions/download-artifact@v4
        with:
          name: backend-push-checks
          path: app/build/reports/parity
      - name: Obtener APK y versión
        uses: actions/download-artifact@v4
        with:
          name: rutautp-debug
          path: app/build/outputs/apk/debug
      - name: Obtener APK de pruebas
        uses: actions/download-artifact@v4
        with:
          name: rutautp-debug-androidTest
          path: app/build/outputs/apk/androidTest/debug
      - name: Verificar candidata y límites de validación
        run: python tools/verificar_entrega.py
      - name: Conservar evidencia de la candidata
        uses: actions/upload-artifact@v4
        with:
          name: local-candidate-checks
          path: |
            app/build/reports/parity/release-candidate.json
            app/build/reports/parity/performance-check.json
          if-no-files-found: error
          retention-days: 14
